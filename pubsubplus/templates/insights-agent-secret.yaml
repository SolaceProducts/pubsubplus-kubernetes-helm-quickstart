{{- define "insightsAgent.sempPort" -}}
{{- if .Values.tls.enabled -}}
1943
{{- else -}}
8080
{{- end -}}
{{- end -}}

{{- define "insightsAgent.sempProtocol" -}}
{{- if .Values.tls.enabled -}}
https
{{- else -}}
http
{{- end -}}
{{- end -}}

{{- define "insightsAgent.password" -}}
{{- $secretName := printf "%s-insights-secrets" (include "solace.fullname" .) }}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- if $secret }}
  {{- index $secret.data "username_insights_password" | b64dec }}
{{- else }}
  {{- randAlpha 10 }}
{{- end }}
{{- end -}}

{{- if .Values.insights.enabled }}
{{- if not .Values.insights.environmentVariables }}
{{- fail "insights.environmentVariables must be defined when Insights is enabled" }}
{{- end }}
{{- /* INSIGHTS_AGENT_API_KEY / INSIGHTS_AGENT_SITE are only required in standard mode.
       In forwarding mode the agent does not use them (custom-entrypoint.sh overrides
       DD_API_KEY, and DD_SITE falls back to the agent default when left empty), so
       they are optional there. */ -}}
{{- if not .Values.insights.forwarding.enabled }}
{{- if not .Values.insights.environmentVariables.INSIGHTS_AGENT_API_KEY }}
{{- fail "insights.environmentVariables.INSIGHTS_AGENT_API_KEY must be defined when Insights is enabled" }}
{{- end }}
{{- if not .Values.insights.environmentVariables.INSIGHTS_AGENT_SITE }}
{{- fail "insights.environmentVariables.INSIGHTS_AGENT_SITE must be defined when Insights is enabled" }}
{{- end }}
{{- end }}
{{- if not .Values.insights.environmentVariables.INSIGHTS_AGENT_TAGS }}
{{- fail "insights.environmentVariables.INSIGHTS_AGENT_TAGS must be defined when Insights is enabled" }}
{{- end }}

{{- if and .Values.insights.forwarding.logsConfig (not .Values.insights.forwarding.enabled) }}
{{- fail "insights.forwarding.logsConfig only takes effect when insights.forwarding.enabled=true" }}
{{- end }}

{{- if .Values.insights.forwarding.enabled }}
{{- $f := .Values.insights.forwarding }}
{{- if not (or $f.otelConfig $f.otelConfigPrimary) }}
{{- fail "insights.forwarding.enabled=true requires insights.forwarding.otelConfig (or insights.forwarding.otelConfigPrimary)" }}
{{- end }}
{{- if .Values.solace.redundancy }}
{{- if not (or $f.otelConfig $f.otelConfigBackup) }}
{{- fail "HA (solace.redundancy=true) requires insights.forwarding.otelConfigBackup or insights.forwarding.otelConfig for the backup node" }}
{{- end }}
{{- if not (or $f.otelConfig $f.otelConfigMonitor) }}
{{- fail "HA (solace.redundancy=true) requires insights.forwarding.otelConfigMonitor or insights.forwarding.otelConfig for the monitor node" }}
{{- end }}
{{- end }}
{{- end }}

{{- $insightsPasswordValue := include "insightsAgent.password" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "solace.fullname" . }}-insights-secrets
  labels:
    app.kubernetes.io/name: {{ template "solace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  username_insights_password: {{ $insightsPasswordValue | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "solace.fullname" . }}-insights-agent-env-secrets
type: Opaque
data:
  {{- /* Keys the chart manages directly in the data block below (b64-encoded, alongside the
         operator vars). Exclude them from the operator environmentVariables loop so a key is
         never emitted twice in the same map. They live in data (not stringData) so helm's
         3-way merge prunes any key dropped on a later upgrade; stringData is folded into data
         by the API server and would otherwise leave stale keys behind.
         Keep this list in sync with the managed keys emitted below. */ -}}
  {{- $managedKeys := list "INSIGHTS_AGENT_BROKER_HOSTNAME" "INSIGHTS_AGENT_SEMP_USERNAME" "INSIGHTS_AGENT_SEMP_PASSWORD" "INSIGHTS_AGENT_SEMP_PORT" "INSIGHTS_AGENT_SEMP_PROTOCOL" "INSIGHTS_AGENT_HEALTH_CHECK_PORT" }}
  {{- if .Values.insights.forwarding.enabled }}
  {{- $managedKeys = concat $managedKeys (list "INSIGHTS_AGENT_THIRD_PARTY_FORWARDING_ENABLED" "INSIGHTS_AGENT_TELEMETRY_ENABLED") }}
  {{- end }}
  {{- /* INSIGHTS_AGENT_API_KEY / INSIGHTS_AGENT_SITE default to "" in the chart values and
         Helm merges those empty defaults in even when the operator omits them. In forwarding
         mode they are optional (the agent supplies its own), so skip them when empty rather
         than emitting blank env vars. In standard mode validation above already requires them
         to be non-empty. The container consumes this Secret via envFrom, so an omitted key
         simply means the env var is unset and the pod still starts normally. */ -}}
  {{- $skipIfEmpty := list "INSIGHTS_AGENT_API_KEY" "INSIGHTS_AGENT_SITE" }}
  {{- range $key, $value := .Values.insights.environmentVariables }}
  {{- if not (has $key $managedKeys) }}
  {{- if not (and (has $key $skipIfEmpty) (eq ($value | toString) "")) }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  INSIGHTS_AGENT_BROKER_HOSTNAME: {{ "localhost" | b64enc | quote }}
  INSIGHTS_AGENT_SEMP_USERNAME: {{ "insights" | b64enc | quote }}
  INSIGHTS_AGENT_SEMP_PASSWORD: {{ $insightsPasswordValue | b64enc | quote }}
  INSIGHTS_AGENT_SEMP_PORT: {{ include "insightsAgent.sempPort" . | b64enc | quote }}
  INSIGHTS_AGENT_SEMP_PROTOCOL: {{ include "insightsAgent.sempProtocol" . | b64enc | quote }}
  INSIGHTS_AGENT_HEALTH_CHECK_PORT: {{ "5550" | b64enc | quote }}
{{- if .Values.insights.forwarding.enabled }}
  INSIGHTS_AGENT_THIRD_PARTY_FORWARDING_ENABLED: {{ "true" | b64enc | quote }}
  INSIGHTS_AGENT_TELEMETRY_ENABLED: {{ "false" | b64enc | quote }}
  {{- /* By default the chart passes the broker scaling tier (INSIGHTS_AGENT_BROKER_SIZE =
         solace.size with the "prod" prefix stripped) and the datadog-agent maps it to
         GOMEMLIMIT. Two cases keep GOMEMLIMIT chart-computed instead:
           1. the operator set INSIGHTS_AGENT_GOMEMLIMIT explicitly (it passes through the
              operator range loop above; do not emit it here too), or
           2. the operator overrode insights.resources.limits.memory -- the agent's fixed
              per-tier map would not reflect that custom limit. Only an explicit
              limits.memory counts, not a requests-driven clamp; operator guidance for
              that case lives with the values.yaml environmentVariables docs.
         An operator-supplied INSIGHTS_AGENT_BROKER_SIZE likewise suppresses the
         auto-injected tier (no duplicate key).
         Lockstep contract: the agent's tier map (solace-datadog-agent
         agent/custom-entrypoint.sh) must accept {dev,1k,10k,100k,200k}; an agent image
         without it leaves GOMEMLIMIT unset (no Go soft limit), so keep that map, this
         tier translation, and the bundled insights.image in sync. */ -}}
  {{- if and (not .Values.insights.environmentVariables.INSIGHTS_AGENT_GOMEMLIMIT) (not .Values.insights.environmentVariables.INSIGHTS_AGENT_BROKER_SIZE) }}
  {{- if (.Values.insights.resources.limits | default dict).memory }}
  INSIGHTS_AGENT_GOMEMLIMIT: {{ include "insights.agentGomemLimit" . | b64enc | quote }}
  {{- else }}
  INSIGHTS_AGENT_BROKER_SIZE: {{ trimPrefix "prod" .Values.solace.size | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
